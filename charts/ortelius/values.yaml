# --------------------------------------------------------------------------
# Ortelius umbrella values
#
# NOTE: the scheduling/resource keys below require the subchart template
# changes in ./subchart-patches/. Until those ship, Helm will silently
# ignore every key it does not recognise — nothing will error, and nothing
# will take effect. Verify with `helm template` before trusting a rollout.
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
# 1. arangodb
# --------------------------------------------------------------------------
arangodb:
  arangodb_pass: ""
  arangodb_user: "root"
  arangodb_host: "localhost"
  arangodb_port: "8529"
  arangodb_name: "vulnmgt"

  # Memory request == limit -> Guaranteed QoS, no kubelet eviction.
  # CPU limit deliberately omitted: throttling stalls RocksDB compaction.
  #
  # Measured steady state after dropping the four redundant edge indexes:
  # 5m CPU / ~1305Mi, RocksDB idle (compaction_pending=0). The earlier
  # 1421m was write amplification from ~4.2M unused index entries.
  # 300m is ~60x measured, leaving room for query bursts and `cve` growth.
  resources:
    requests:
      cpu: 300m
      memory: 4Gi
    limits:
      cpu: 300m
      memory: 4Gi

  # ArangoDB sizes caches from HOST memory unless overridden, so it will
  # allocate past the cgroup limit and get OOM-killed (exit 137).
  # INVARIANT: overrideTotalMemory (bytes) == resources.limits.memory.
  # Memory stays at 4Gi -- the ~2.8GB dataset still benefits from cache,
  # and memory was never the bottleneck.
  rocksdb:
    overrideTotalMemory: "4294967296"   # 4Gi
    blockCacheSize: "2147483648"        # 2Gi
    totalWriteBufferSize: "536870912"   # 512Mi
    enforceBlockCacheSizeLimit: true

  nodeSelector:
    kubernetes.io/os: linux
    workload: system

  probes:
    enabled: false
    startup:
      periodSeconds: 10
      failureThreshold: 60    # 10 min for WAL replay before liveness starts

# --------------------------------------------------------------------------
# 2. frontend  (measured: 2m CPU / 113Mi)
# --------------------------------------------------------------------------
frontend:
  ingress:
    type: "glb"
  graphqlEndpoint: "https://app.ortelius.io/api/v1/graphql"

  # Measured: 2m CPU / 113Mi. Matched cpu+memory req/lim -> Guaranteed QoS.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 50m
      memory: 256Mi

  nodeSelector:
    kubernetes.io/os: linux
    workload: system

  # frontend is the public entry point behind the GLB ingress; keeping it on
  # system-pool means a spot preemption cannot take down the UI.

# --------------------------------------------------------------------------
# 3. ortelius  (measured: 69m CPU / 176Mi)
# --------------------------------------------------------------------------
ortelius:
  # Measured: 69m CPU / 176Mi. cpu request == limit and memory request ==
  # limit together give Guaranteed QoS; with only memory matched the pod
  # stays Burstable and remains evictable under node memory pressure.
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 150m
      memory: 384Mi

  nodeSelector:
    kubernetes.io/os: linux
    workload: system

# --------------------------------------------------------------------------
# 4. osvdev-job
#
# concurrencyPolicy: Forbid is already hardcoded in the subchart. Combined
# with the ~17 min run on 2026-08-11 (10.5 min of it blocked on the Ubuntu
# ecosystem fetch), that is what SKIPPED ticks 29773035 and 29773050.
# activeDeadlineSeconds caps a run below the 15 min interval so a stall
# fails fast and the next tick still runs.
# --------------------------------------------------------------------------
osvdev-job:
  schedule: "*/15 * * * *"
  activeDeadlineSeconds: 780     # 13 min
  backoffLimit: 2
  ttlSecondsAfterFinished: 300

  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1Gi

  nodeSelector:
    kubernetes.io/os: linux
    workload: batch

  tolerations:
    - key: workload
      operator: Equal
      value: batch
      effect: NoSchedule

# --------------------------------------------------------------------------
# 5. relscanner-job
# --------------------------------------------------------------------------
relscanner-job:
  schedule: "*/15 * * * *"
  activeDeadlineSeconds: 780
  backoffLimit: 2
  ttlSecondsAfterFinished: 300

  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1Gi

  nodeSelector:
    kubernetes.io/os: linux
    workload: batch

  tolerations:
    - key: workload
      operator: Equal
      value: batch
      effect: NoSchedule
